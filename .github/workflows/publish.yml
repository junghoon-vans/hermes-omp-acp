name: Publish Python distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z (optional aN/bN/rcN) tag to publish to TestPyPI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install manifest parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate release tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH_ENVIRONMENT: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
        run: python .github/scripts/prepare_release.py

  compatibility:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, compatibility]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-distributions
          path: dist
      - name: Publish to TestPyPI
        if: needs.prepare.outputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: needs.prepare.outputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
