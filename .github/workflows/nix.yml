name: Nix packaging

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-python@v5
        if: github.ref_type == 'tag'
        with:
          python-version: '3.14'
      - name: Install manifest parser
        if: github.ref_type == 'tag'
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate release tag and Nix package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import runpy

          prepare = runpy.run_path(".github/scripts/prepare_release.py")["prepare"]
          prepare(os.environ["RELEASE_TAG"], Path.cwd())
          PY
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          version="$(nix eval --raw --no-update-lock-file ".#packages.$system.default.version")"
          if [ "$version" != "${RELEASE_TAG#v}" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Nix package version $version"
            exit 1
          fi
          echo "Validated $RELEASE_TAG against plugin.yaml and Nix package version $version"
      - name: Build provider and check installed environment
        run: |
          nix build --no-link --no-update-lock-file
          nix flake check --no-update-lock-file --print-build-logs
      - name: Reject a sealed host without the ACP SDK
        run: |
          if nix build --no-link --impure --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = builtins.currentSystem; };
            in flake.lib.mkHermesPlugin {
              hermes = {
                python = pkgs.python314;
                hermesVenv = pkgs.python314.withPackages (ps: [ ps.packaging ]);
              };
            }
          ' > rejected-host.log 2>&1; then
            cat rejected-host.log
            echo "::error::A sealed host without the SDK was accepted"
            exit 1
          fi
          cat rejected-host.log
          grep -F 'installed missing' rejected-host.log
