name: Provider compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate for publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  pm-git-install:
    name: Hermes 0.22.5 PM Git install / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e
          path: .hermes-upstream
      - name: Admit and enable the exact Git revision through official PM
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.14 python \
            .github/scripts/smoke_pm_install.py --hermes-source .hermes-upstream

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum Hermes / OMP
            python: "3.11"
            hermes_ref: v2026.9.21
            hermes_extra: acp
            omp: "15.7.6"
            upload_artifact: false
          - name: Latest Hermes / OMP
            python: "3.14"
            hermes_ref: latest
            hermes_extra: acp
            omp: latest
            upload_artifact: false
          - name: Hermes 0.22.5 / latest OMP (all extras)
            python: "3.14"
            hermes_ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e
            hermes_extra: all
            omp: latest
            upload_artifact: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions
        run: |
          uv build --out-dir dist
          uvx --from twine twine check --strict dist/*
      - name: Resolve the official Hermes revision
        id: hermes
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_REF: ${{ matrix.hermes_ref }}
        run: |
          if [ "$HERMES_REF" = latest ]; then
            ref=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq '.tag_name')
          else
            ref="$HERMES_REF"
          fi
          sha=$(gh api "repos/NousResearch/hermes-agent/commits/$ref" --jq '.sha')
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "Hermes ref: $ref ($sha)"
      - uses: actions/checkout@v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.hermes.outputs.ref }}
          path: .hermes-upstream
      - name: Install official Hermes dependencies and provider wheel together
        run: |
          uv venv --python "${{ matrix.python }}" .hermes-upstream/.venv
          (
            cd .hermes-upstream
            uv pip install --python .venv/bin/python \
              -r pyproject.toml \
              --extra "${{ matrix.hermes_extra }}" \
              "$GITHUB_WORKSPACE"/dist/*.whl
          )
          git -C .hermes-upstream diff --exit-code HEAD -- pyproject.toml uv.lock
      - name: Check installed package and dependency compatibility
        run: |
          .hermes-upstream/.venv/bin/python - <<'PY'
          from importlib.metadata import distribution, version
          from pathlib import Path
          import subprocess
          import sys

          import tomllib
          from packaging.requirements import Requirement
          from packaging.version import Version

          source = Path(".hermes-upstream").resolve()
          environment_python = source / ".venv" / "bin" / "python"
          check = subprocess.run(
              ["uv", "pip", "check", "--python", str(environment_python)],
              capture_output=True,
              check=False,
              text=True,
          )
          report = check.stdout + check.stderr
          if report:
              print(report, end="" if report.endswith("\n") else "\n")
          if check.returncode:
              sys.path.insert(0, str(source))
              try:
                  from pm.pip_check import unexpected_incompatibilities
              except ImportError as error:
                  print(
                      "Official Hermes lock checker unavailable; failing raw uv pip check.",
                      file=sys.stderr,
                  )
                  raise SystemExit(check.returncode) from error
              unexpected = unexpected_incompatibilities(report, source / "uv.lock")
              if unexpected != []:
                  if unexpected is None:
                      print("Could not validate uv pip check output against the official lock.", file=sys.stderr)
                  else:
                      print("Unexpected dependency incompatibilities:", file=sys.stderr)
                      print("\n".join(unexpected), file=sys.stderr)
                  raise SystemExit(check.returncode or 1)
              print(
                  "Accepted only the dependency incompatibilities explicitly recorded "
                  "as overrides in the official Hermes lock."
              )

          provider = distribution("hermes-omp-acp")
          sdk_requirement = next(
              Requirement(item)
              for item in provider.requires or ()
              if Requirement(item).name == "agent-client-protocol"
          )
          sdk_version = Version(version("agent-client-protocol"))
          assert sdk_version in sdk_requirement.specifier, (
              f"{sdk_version} does not satisfy {sdk_requirement}"
          )
          upstream = tomllib.loads((source / "pyproject.toml").read_text())
          hermes_sdk_requirements = [
              Requirement(item)
              for item in upstream["project"]["optional-dependencies"]["acp"]
              if Requirement(item).name == "agent-client-protocol"
          ]
          assert hermes_sdk_requirements, "Official Hermes acp extra has no SDK requirement"
          for requirement in hermes_sdk_requirements:
              assert requirement.marker is None or requirement.marker.evaluate(), (
                  f"Official Hermes SDK requirement is inactive: {requirement}"
              )
              assert sdk_version in requirement.specifier, (
                  f"{sdk_version} does not satisfy original Hermes {requirement}"
              )
          print(
              f"Original Hermes: {hermes_sdk_requirements}; "
              f"provider: {sdk_requirement}; installed SDK: {sdk_version}"
          )
          PY
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Install the OMP release
        env:
          OMP_VERSION: ${{ matrix.omp }}
        run: |
          mkdir -p "$RUNNER_TEMP/omp"
          printf '{"private":true}\n' > "$RUNNER_TEMP/omp/package.json"
          bun add --cwd "$RUNNER_TEMP/omp" "@oh-my-pi/pi-coding-agent@$OMP_VERSION"
          "$RUNNER_TEMP/omp/node_modules/.bin/omp" --version
          echo "OMP_INTEGRATION_COMMAND=$RUNNER_TEMP/omp/node_modules/.bin/omp" >> "$GITHUB_ENV"
      - name: Smoke installed discovery and native ACP without a model call
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-upstream
        run: .hermes-upstream/.venv/bin/python -P .github/scripts/smoke_discovery.py
      - name: Exercise the installed provider through Hermes
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.hermes-upstream"
          uv run --project .hermes-upstream --no-sync python -P -m unittest discover -s tests -v
      - name: Exercise native OMP model selection and file reading
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.hermes-upstream"
          uv run --project .hermes-upstream --no-sync python -P -m unittest discover -s tests/integration -v
      - uses: actions/upload-artifact@v4
        if: matrix.upload_artifact == true
        with:
          name: provider-distributions
          path: dist/*
          if-no-files-found: error
