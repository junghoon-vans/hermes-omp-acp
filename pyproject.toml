[build-system]
requires = ["hatchling>=1.27,<2", "PyYAML>=6,<7"]
build-backend = "hatchling.build"

[project]
name = "hermes-omp-acp"
dynamic = ["version", "description"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Junghoon Ban" }]
requires-python = ">=3.11"
dependencies = ["agent-client-protocol>=0.10.1,<0.11"]

[project.urls]
Repository = "https://github.com/junghoon-vans/hermes-omp-acp"

[project.entry-points."hermes_agent.plugins"]
omp-acp-provider = "hermes_omp_acp.provider:register"

[tool.hatch.build.targets.wheel]
packages = ["hermes_omp_acp"]

[tool.hatch.metadata.hooks.custom]
