[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-omp-acp-delegator"
version = "2.0.0"
description = "Standalone Hermes plugin for delegating coding tasks to Oh My Pi over ACP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Junghoon Ban" }]
requires-python = ">=3.11,<3.15"
dependencies = ["agent-client-protocol==0.9.0"]

[project.urls]
Homepage = "https://github.com/junghoon-vans/hermes-omp-acp/tree/main/delegator"
Repository = "https://github.com/junghoon-vans/hermes-omp-acp"

[project.entry-points."hermes_agent.plugins"]
omp-acp-delegator = "hermes_omp_delegator"

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "config.py", "worker.py", "transport.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "hermes_omp_delegator"

[tool.hatch.build.targets.sdist]
only-include = [
  "__init__.py",
  "config.py",
  "worker.py",
  "transport.py",
  "plugin.yaml",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
